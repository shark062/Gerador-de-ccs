<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CC Generator Pro | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .card { background-color: #1e293b; border: 1px solid #334155; }
        .btn-primary { background-color: #3b82f6; transition: all 0.3s; }
        .btn-primary:hover { background-color: #2563eb; transform: translateY(-2px); }
        .status-valid { color: #22c55e; font-weight: bold; }
        .status-declined { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-10">

    <div class="max-w-4xl w-full">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold text-blue-500">CC Generator <span class="text-white">Pro</span></h1>
            <p class="text-slate-400">Processamento Automático de Lote</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="card p-6 rounded-xl shadow-2xl">
                <h2 class="text-xl font-semibold mb-4 border-b border-slate-700 pb-2">Configurações</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">BIN</label>
                        <input type="text" id="bin" placeholder="Ex: 453212" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">Quantidade (Máx 100)</label>
                        <input type="number" id="amount" value="10" min="1" max="100" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <button onclick="processarTudo()" id="btn-gerar" class="w-full btn-primary text-white font-bold py-3 rounded-lg mt-4 shadow-lg">
                        Gerar e Testar Lote
                    </button>
                </div>
            </div>

            <div class="card p-6 rounded-xl shadow-2xl">
                <h2 class="text-xl font-semibold mb-4 border-b border-slate-700 pb-2">Status do Processo</h2>
                <div id="status-log" class="text-sm text-slate-400 h-32 overflow-y-auto italic">
                    Aguardando comando...
                </div>
                <div class="mt-4 space-x-2">
                    <button onclick="copiarResultados('valid')" class="text-xs bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded">Copiar Válidos</button>
                    <button onclick="copiarResultados('invalid')" class="text-xs bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded">Copiar Inválidos</button>
                </div>
            </div>
        </div>

        <div class="mt-10 card p-6 rounded-xl shadow-2xl overflow-hidden">
            <h2 class="text-xl font-semibold mb-4">Resultados em Tempo Real</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-900 text-slate-400 uppercase text-xs">
                        <tr>
                            <th class="p-3">Número</th>
                            <th class="p-3">Validade</th>
                            <th class="p-3">CVV</th>
                            <th class="p-3">Status</th>
                            <th class="p-3">Saldo</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-corpo" class="divide-y divide-slate-700">
                        <!-- Dados via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://gerador-de-ccs.onrender.com'; // Certifique-se que é sua URL de backend
        let listaVálidos = [];
        let listaInválidos = [];

        async function processarTudo() {
            const bin = document.getElementById('bin').value;
            const amount = document.getElementById('amount').value;
            const log = document.getElementById('status-log');
            const tabela = document.getElementById('tabela-corpo');
            const btn = document.getElementById('btn-gerar');

            if (!bin) { alert("Insira um BIN!"); return; }

            // Reset
            log.innerHTML = "Iniciando processamento em lote...";
            tabela.innerHTML = "";
            listaVálidos = [];
            listaInválidos = [];
            btn.disabled = true;
            btn.innerText = "Processando...";

            try {
                const response = await fetch(`${API_URL}/process_batch`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bin: bin, amount: parseInt(amount) })
                });

                if (!response.ok) throw new Error("Erro na resposta do servidor");

                const data = await response.json();
                
                listaVálidos = data.valid;
                listaInválidos = data.invalid;

                log.innerHTML = `Processo concluído!<br>Válidos: ${data.summary.valid_count}<br>Inválidos: ${data.summary.invalid_count}`;
                
                renderizarTabela(data.valid, data.invalid);

            } catch (error) {
                log.innerHTML = `<span class="text-red-500">Erro: ${error.message}</span>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "Gerar e Testar Lote";
            }
        }

        function renderizarTabela(valid, invalid) {
            const tabela = document.getElementById('tabela-corpo');
            tabela.innerHTML = "";

            // Mostra primeiro os válidos
            const todos = [...valid, ...invalid];
            
            todos.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-800 transition-colors";
                const statusClass = item.balance > 0 ? "status-valid" : "status-declined";
                const statusText = item.balance > 0 ? "VALIDO" : "DECLINADO";

                tr.innerHTML = `
                    <td class="p-3 font-mono">${item.cc}</td>
                    <td class="p-3">${item.expiry}</td>
                    <td class="p-3">${item.cvv}</td>
                    <td class="p-3"><span class="${statusClass}">${statusText}</span></td>
                    <td class="p-3 ${item.balance > 0 ? 'text-green-400' : 'text-red-400'}">$ ${item.balance.toFixed(2)}</td>
                `;
                tabela.appendChild(tr);
            });
        }

        function copiarResultados(tipo) {
            const lista = tipo === 'valid' ? listaVálidos : listaInválidos;
            if (lista.length === 0) {
                alert("Não há cartões para copiar!");
                return;
            }

            const texto = lista.map(c => `${c.cc}|${c.expiry}|${c.cvv}|${c.balance}`).join('\n');
            
            navigator.clipboard.writeText(texto).then(() => {
                alert(`${tipo.toUpperCase()} copiados com sucesso!`);
            }).catch(err => {
                alert("Erro ao copiar: " + err);
            });
        }
    </script>
</body>
                    </html>
